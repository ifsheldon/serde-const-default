[package]
name = "serde-const-default"
version = "0.1.0"
edition = "2024"
authors = ["Feng <feng.liang@alumni.kaust.edu.sa>"]
description = "A procedural macro to provide const default values for serde deserialization."
license = "MIT"
repository = "https://github.com/ifsheldon/serde-const-default"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
